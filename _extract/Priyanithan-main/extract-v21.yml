name: Deploy OlympTrade Bot v2.1 ASIA-X

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract v2.1 ASIA-X bot
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -o Priyanithan-OlympTrade-LiveBot-v2.1-ASIA-X.zip -d extracted
          cp -r extracted/* .
          rm -rf extracted
          rm -f Priyanithan-OlympTrade-LiveBot-v2.1-ASIA-X.zip

      - name: Commit extracted bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy v2.1 ASIA-X bot" || echo "No changes"
          git push
