name: Enable Fast Manual Entry
on:
  push:
    paths:
      - fast_manual_entry.py
      - enable_fast_manual_entry.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python enable_fast_manual_entry.py
      - run: python -m py_compile fast_manual_entry.py sitecustomize.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitecustomize.py
          if git diff --cached --quiet; then
            echo "No bootstrap change needed"
          else
            git commit -m "Enable fast manual entry UI"
            git push origin main
          fi
