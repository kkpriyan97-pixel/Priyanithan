        col=(20,130,110) if i%4 else (130,45,75)
        d.line((x+6,top-12,x+6,bot+12),fill=col,width=2); d.rectangle((x,top,x+12,bot),fill=col)
    items=list(evidence or ())[:3] or ['Multi-indicator alignment verified']
    ry=1030
    cols=[(30,235,160),(30,180,240),(250,195,25)]
    for i,item in enumerate(items):
        d.ellipse((58,ry+5,78,ry+25),fill=cols[i%3])
        lines=_wrap_lines(d,item,490,_font(20))
        for line in lines[:2]:
