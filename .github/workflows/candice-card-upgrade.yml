        d.arc((cx-r-off,cy-r-off,cx+r+off,cy+r+off), 18, 150, fill=col, width=w)
    d.ellipse((cx-r+18,cy-r+18,cx+r-18,cy+r-18), fill=(2,16,25), outline=(0, 235, 180), width=3)
    txt(cx, 422, 'LIVE TIMER', 22, white, True, 'mm')
