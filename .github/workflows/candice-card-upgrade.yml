    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install Pillow
      - name: Replace visual card
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.py')
