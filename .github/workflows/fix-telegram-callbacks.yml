name: Fix Telegram Callback Updates

on:
  push:
    paths:
      - fast_manual_entry.py
      - .github/workflows/fix-telegram-callbacks.yml
permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch webhook callback updates
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("sitecustomize.py")
          s = p.read_text(encoding="utf-8")
          old = 'allowed_updates=["message"]'
          new = 'allowed_updates=["message", "callback_query"]'
          if old in s:
              s = s.replace(old, new)
          elif new not in s:
              raise SystemExit("Telegram webhook allowed_updates anchor not found")
          p.write_text(s, encoding="utf-8")
          print("Telegram callback_query updates enabled")
          PY
          python -m py_compile fast_manual_entry.py sitecustomize.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitecustomize.py
          if git diff --cached --quiet; then
            echo "No change required"
          else
            git commit -m "Allow Telegram manual-entry callback queries"
            git push origin main
          fi
