name: Repair missing OlympTrade connection loop

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore missing connection loop from known-good commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path("app.py")
          current = path.read_text(encoding="utf-8")

          if "async def olymptrade_connect_loop():" in current:
              print("olymptrade_connect_loop already present; nothing to repair")
              raise SystemExit(0)

          old = subprocess.check_output([
              "git", "show",
              "b3223c0d5c88ac2ead4f39646f3eef6a3e776706:app.py"
          ], text=True)

          start = old.index("async def olymptrade_connect_loop():")
          end = old.index("async def get_ot_candles", start)
          function = old[start:end]

          marker = "async def get_ot_candles(pair, timeframe=60, count=120):"
          if marker not in current:
              raise SystemExit("Expected get_ot_candles marker not found; aborting safely")

          current = current.replace(marker, function + marker, 1)
          path.write_text(current, encoding="utf-8")
          print("Restored olymptrade_connect_loop from known-good commit")
          PY

      - name: Verify Python syntax
        run: python -m py_compile app.py olymptrade_ws/core/*.py olymptrade_ws/api/*.py olymptrade_ws/olympconfig/*.py

      - name: Commit repair
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Restore OlympTrade connection loop"
          git push origin HEAD:main
