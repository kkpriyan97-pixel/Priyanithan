name: Repair missing runtime symbols

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Repair missing runtime callback and scan symbols')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch app.py
        shell: python
        run: |
          from pathlib import Path
          import ast
          import subprocess

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          def has_func(name):
              tree = ast.parse(text)
              return any(isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == name for n in tree.body)

          changed = False

          if not has_func('on_balance'):
              marker = '\n\ndef extract_instruments(message):'
              block = '''\n\nasync def on_balance(message):\n    """Read-only OlympTrade balance callback; never places or modifies trades."""\n    log.debug("OlympTrade balance update received (read-only).")\n'''
              if marker not in text:
                  raise SystemExit('Cannot locate extract_instruments marker')
              text = text.replace(marker, block + marker, 1)
              changed = True

          if not has_func('on_trade_event'):
              marker = '\n\nasync def olymptrade_connect_loop():'
              block = '''\n\nasync def on_trade_event(message):\n    """Record broker trade events for read-only monitoring; never executes trades."""\n    event = message.get("e") if isinstance(message, dict) else None\n    data = message.get("d", []) if isinstance(message, dict) else []\n    if not isinstance(data, list):\n        return\n    for item in data:\n        if not isinstance(item, dict):\n            continue\n        trade_id = item.get("id")\n        if not trade_id:\n            continue\n        manual_trades.setdefault(str(trade_id), {}).update({\n            "event": event,\n            "data": item,\n            "updated_at": time.time(),\n        })\n'''
              if marker not in text:
                  raise SystemExit('Cannot locate olymptrade_connect_loop marker')
              text = text.replace(marker, block + marker, 1)
              changed = True

          if not has_func('scan_loop'):
              marker = '\n\n# ============================================================\n# RUNTIME\n# ============================================================' 
              block = '''\n\nasync def scan_loop(application):\n    """Run the existing scan_cycle on UAE-aligned 5-minute boundaries."""\n    await wait_until_next_5min_uae()\n    while True:\n        try:\n            await scan_cycle(application)\n        except asyncio.CancelledError:\n            raise\n        except Exception:\n            log.exception("Scanner loop error")\n        await wait_until_next_5min_uae()\n'''
              if marker not in text:
                  raise SystemExit('Cannot locate runtime marker')
              text = text.replace(marker, block + marker, 1)
              changed = True

          if not changed:
              print('No repair needed; all runtime symbols already exist.')
          else:
              ast.parse(text)
              path.write_text(text, encoding='utf-8')
              subprocess.run(['python', '-m', 'py_compile', 'app.py'], check=True)
              print('Runtime symbol repair validated successfully.')

      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git rm .github/workflows/repair-runtime-symbols.yml
          git diff --cached --quiet && exit 0 || true
          git commit -m "Fix missing runtime symbols and scan loop"
          git push origin main
