name: Candice AI 24-7 Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ai247:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile AI runtime layers
        run: python -m py_compile candice_ai_247.py candice_ready_timer.py candice_recovery_timer.py candice_telegram_ratefix.py sitecustomize.py
      - name: Verify 24-7 safety contract
        run: |
          python - <<'PY'
          from pathlib import Path
          ai=Path('candice_ai_247.py').read_text()
          site=Path('sitecustomize.py').read_text()
          ready=Path('candice_ready_timer.py').read_text()
          assert 'await app.analyze' in ai
          assert 'app.scan_once = ai_247_scan' in ai
          assert 'minute % 5' in ai
          assert 'signal_checkpoint=5m' in ai
          assert 'CANDICE AI 24/7 ACTIVE' in ai
          assert 'candice_ai_247' in site
          assert 'AI MANAGER • 24/7 ACTIVE' in ready
          assert 'AI continues analyzing every 1 MIN' in ready
          print('AI 24/7 RUNTIME CONTRACT: PASS')
          PY
