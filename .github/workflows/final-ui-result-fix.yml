name: Final Telegram UI and Result Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final bot fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          original = s

          # /start must acknowledge immediately and launch exactly one background scan.
          if 'manual_scan_task = None' not in s:
              s = s.replace('telegram_application = None\n', 'telegram_application = None\nmanual_scan_task = None\n', 1)

          old_start = '''async def start_cmd(update: Update, context: ContextTypes.DEFAULT_TYPE):
              remember_chat(update)
              await update.message.reply_text("Priyanithan AI is online. Use /access YOUR_CODE to authorize this chat.")
          '''
          new_start = '''async def start_cmd(update: Update, context: ContextTypes.DEFAULT_TYPE):
              global manual_scan_task
              remember_chat(update)
              if not is_authorized(update):
                  await update.message.reply_text(
                      "Priyanithan AI is online. Use /access YOUR_CODE first; then /start again to begin a live scan."
                  )
                  return
              if manual_scan_task is not None and not manual_scan_task.done():
                  await update.message.reply_text("⏳ Live scan is already running. Please wait for the result.")
                  return
              await update.message.reply_text("⚡ LIVE SCAN STARTED — analysing fresh market data now...")
              manual_scan_task = asyncio.create_task(scan_cycle(context.application), name="manual-scan")
          '''
          if old_start in s:
              s = s.replace(old_start, new_start, 1)
          else:
              pattern = r'async def start_cmd\(update: Update, context: ContextTypes\.DEFAULT_TYPE\):.*?(?=\nasync def scan_cmd)'
              s = re.sub(pattern, new_start.rstrip(), s, count=1, flags=re.S)

          # /scan uses the same non-blocking single-task guard.
          old_scan = '''    await update.message.reply_text("🔎 Live scan started...")
              await scan_cycle(context.application)
          '''
          new_scan = '''    global manual_scan_task
              if manual_scan_task is not None and not manual_scan_task.done():
                  await update.message.reply_text("⏳ Live scan is already running. Please wait for the result.")
                  return
              await update.message.reply_text("🔎 Live scan started — analysing fresh market data now...")
              manual_scan_task = asyncio.create_task(scan_cycle(context.application), name="manual-scan")
          '''
          if old_scan in s:
              s = s.replace(old_scan, new_scan, 1)

          # Source-of-truth webhook must accept callback_query updates.
          s = s.replace('allowed_updates=["message"],', 'allowed_updates=["message", "callback_query"],')

          p.write_text(s, encoding='utf-8')

          # Make the manual button deterministic and show its next state after click.
          f = Path('fast_manual_entry.py')
          fs = f.read_text(encoding='utf-8')
          old_callback = '''    if query.message is not None:
              await query.message.reply_text(text)
          '''
          new_callback = '''    if query.message is not None:
              try:
                  await query.edit_message_reply_markup(
                      reply_markup=InlineKeyboardMarkup(
                          [[InlineKeyboardButton("⏳ TRADE RUNNING — MANUAL", callback_data=f"RUNNING|{pair}|{direction}|{entry}|{expiry_min}")]]
                      )
                  )
              except Exception:
                  pass
              await query.message.reply_text(text)
          '''
          if old_callback in fs:
              fs = fs.replace(old_callback, new_callback, 1)

          # Ignore a second click on the running-state button.
          marker = 'async def _fast_manual_callback(update, context):\n'
          if 'pattern=r"^RUNNING\\|"' not in fs:
              handler_marker = '    application.add_handler(CallbackQueryHandler(_fast_manual_callback, pattern=r"^FAST\\|"))\n'
              handler_new = handler_marker + '    application.add_handler(CallbackQueryHandler(_running_callback, pattern=r"^RUNNING\\|"))\n'
              running_fn = '''\n\nasync def _running_callback(update, context):\n    query = update.callback_query\n    if query is not None:\n        await query.answer("⏳ Trade is already running; final market result will be sent automatically.", show_alert=False)\n\n'''
              if marker in fs and handler_marker in fs:
                  fs = fs.replace(marker, running_fn + marker, 1)
                  fs = fs.replace(handler_marker, handler_new, 1)

          f.write_text(fs, encoding='utf-8')

          # Keep the runtime compatibility layer aligned with source.
          sc = Path('sitecustomize.py')
          ss = sc.read_text(encoding='utf-8')
          ss = ss.replace('allowed_updates=["message"]', 'allowed_updates=["message", "callback_query"]')
          sc.write_text(ss, encoding='utf-8')

          print('app_changed:', s != original)
          print('start_scan:', 'LIVE SCAN STARTED' in s)
          print('callback_updates:', 'allowed_updates=["message", "callback_query"]' in s)
          print('open_trade:', '⚡ OPEN TRADE' in fs)
          print('running_button:', '⏳ TRADE RUNNING — MANUAL' in fs)
          print('result_monitor_import:', 'import trade_result_monitor' in ss)
          PY

          python -m py_compile app.py fast_manual_entry.py sitecustomize.py trade_result_monitor.py

      - name: Commit final fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py fast_manual_entry.py sitecustomize.py
          if git diff --cached --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git commit -m "Fix live scan buttons and final result flow"
          git push origin main
