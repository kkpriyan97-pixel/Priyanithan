name: Extract OlympTrade Bot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find OlympTrade ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*OlympTrade*.zip' | head -n 1)

          if [[ -z "$ZIP_FILE" ]]; then
            echo "ERROR: OlympTrade ZIP not found"
            ls -la
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract bot source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _extract
          mkdir -p _extract

          unzip -o "$ZIP_FILE" -d _extract

          # Do NOT overwrite GitHub Actions workflows
          rm -rf _extract/.github

          # Copy application files
          cp -a _extract/. .

          rm -rf _extract

      - name: Clean Python cache
        shell: bash
        run: |
          find . \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          find . \
            -type f \
            \( -name "*.pyc" -o -name "*.pyo" \) \
            -delete

      - name: Remove source ZIP
        shell: bash
        run: |
          rm -f "$ZIP_FILE"

      - name: Verify application
        shell: bash
        run: |
          set -euo pipefail

          test -f app.py
          test -f requirements.txt

          python -m py_compile app.py

          echo "================================"
          echo "BOT EXTRACTION SUCCESS"
          echo "================================"

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          # Never commit workflow changes
          git restore --staged .github/workflows 2>/dev/null || true
          git checkout -- .github/workflows 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi

          git commit -m "Extract OlympTrade bot source"

          git push
