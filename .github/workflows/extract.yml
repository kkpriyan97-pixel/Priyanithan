name: Deploy Priyanithan Flex Adaptive v5

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify Flex Adaptive v5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository structure
        run: |
          test -f app.py || { echo "ERROR: app.py not found in repository root"; exit 1; }
          test -f requirements.txt || { echo "ERROR: requirements.txt not found"; exit 1; }
          test -d olymptrade_ws || { echo "ERROR: olymptrade_ws directory not found"; exit 1; }
          echo "Repository structure OK."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: |
          python -m py_compile app.py
          python -m compileall -q olymptrade_ws
          echo "Python compilation successful."

      - name: Verify adaptive durations
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path("app.py").read_text(encoding="utf-8")

          # Accept normal Python formatting such as:
          # (1, 2, 3, 5, 10, 15)
          # (1,2,3,5,10,15)
          patterns = [
              r'\(\s*1\s*,\s*2\s*,\s*3\s*,\s*5\s*,\s*10\s*,\s*15\s*\)',
              r'1\s*\|\s*2\s*\|\s*3\s*\|\s*5\s*\|\s*10\s*\|\s*15'
          ]

          if not any(re.search(p, text) for p in patterns):
              print("ERROR: app.py does not contain the adaptive duration set 1, 2, 3, 5, 10, 15.")
              print("Please replace the repository app.py with the Flex Adaptive v5 app.py.")
              raise SystemExit(1)

          print("Adaptive durations verified: 1, 2, 3, 5, 10, 15 minutes.")
          PY

      - name: Verify auto-trade is disabled
        run: |
          grep -Eq 'AUTO_TRADE[[:space:]]*=[[:space:]]*False' app.py || {
            echo "ERROR: AUTO_TRADE is not explicitly False"
            exit 1
          }
          echo "AUTO_TRADE=False verified."

      - name: Success
        run: echo "Flex Adaptive v5 verification completed successfully."
