name: enable-asia-x-fixed.yml

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract v3 bot ZIP
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -o Priyanithan-OlympTrade-LiveBot-v3-fixed.zip -d extracted

          cp -r extracted/* .

          rm -rf extracted
          rm -f Priyanithan-OlympTrade-LiveBot-v3-fixed.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Deploy v3 PTB lifecycle fix" || echo "No changes"
          git push
