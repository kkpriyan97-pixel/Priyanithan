name: Extract Flex Scanner v5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-v4:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Flex Scanner v4 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            \( -iname 'Priyanithan-flex-scanner-v4*.zip' \
               -o -iname 'Priyanithan-flex-auto-v5*.zip' \) \
            | head -n 1)

          if [[ -z "$ZIP_FILE" ]]; then
            echo "ERROR: Flex Scanner v4 ZIP not found"
            echo "Available ZIP files:"
            find . -maxdepth 1 -type f -iname '*.zip' -print
            exit 1
          fi

          echo "Using: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Flex Scanner v4
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _extract
          mkdir -p _extract

          unzip -o "$ZIP_FILE" -d _extract

          echo "Extracted structure:"
          find _extract -maxdepth 3 -type f | sort

      - name: Locate application root
        shell: bash
        run: |
          set -euo pipefail

          APP_FILE=$(find _extract -type f -name app.py | head -n 1)

          if [[ -z "$APP_FILE" ]]; then
            echo "ERROR: app.py not found inside Flex Scanner ZIP"
            exit 1
          fi

          APP_ROOT=$(dirname "$APP_FILE")

          echo "Application root: $APP_ROOT"
          echo "APP_ROOT=$APP_ROOT" >> "$GITHUB_ENV"

      - name: Install Flex Scanner source
        shell: bash
        run: |
          set -euo pipefail

          # Remove old application files only.
          rm -rf olymptrade_ws
          rm -f app.py
          rm -f requirements.txt
          rm -f simple_bot.py
          rm -f test.py
          rm -f test_api_methods.py

          # Copy the NEW v4 application.
          cp -a "$APP_ROOT"/. .

          # Never overwrite GitHub workflows from inside the ZIP.
          rm -rf .github

          echo "Installed application:"
          ls -la

      - name: Clean Python cache
        shell: bash
        run: |
          find . \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          find . \
            -type f \
            \( -name "*.pyc" -o -name "*.pyo" \) \
            -delete

      - name: Remove Flex ZIP
        shell: bash
        run: |
          rm -f "$ZIP_FILE"

      - name: Verify v4 application
        shell: bash
        run: |
          set -euo pipefail

          test -f app.py
          test -f requirements.txt
          test -d olymptrade_ws

          python -m py_compile app.py

          echo "========================================"
          echo " FLEX SCANNER V4 INSTALLED SUCCESSFULLY"
          echo "========================================"

          grep -n "AUTO_DISCOVER_ASSETS" app.py || true
          grep -n "MAX_ASSETS_PER_CYCLE" app.py || true
          grep -n "MAX_AI_CANDIDATES" app.py || true
          grep -n "SCAN_INTERVAL_SECONDS" app.py || true

      - name: Commit Flex Scanner v4
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          # Preserve existing GitHub workflows.
          git restore --staged .github 2>/dev/null || true
          git checkout -- .github 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No application changes."
            exit 0
          fi

          git commit -m "Install Flex Scanner v4"

          git push
