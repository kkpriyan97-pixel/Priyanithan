name: Deploy Priyanithan Flex Adaptive v5

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify Flex Adaptive v5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          echo "=== Repository root ==="
          pwd
          echo "=== Files ==="
          find . -maxdepth 3 -type f | sort

      - name: Verify required files
        run: |
          test -f app.py || { echo "ERROR: app.py not found in repository root"; exit 1; }
          test -f requirements.txt || { echo "ERROR: requirements.txt not found"; exit 1; }
          test -d olymptrade_ws || { echo "ERROR: olymptrade_ws directory not found"; exit 1; }
          echo "Required files found."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: |
          python -m py_compile app.py
          python -m compileall -q olymptrade_ws
          echo "Python compilation successful."

      - name: Verify adaptive durations
        run: |
          grep -q "1, 2, 3, 5, 10, 15" app.py || {
            echo "ERROR: adaptive duration list 1,2,3,5,10,15 not found"
            exit 1
          }
          echo "Adaptive durations verified: 1, 2, 3, 5, 10, 15 minutes."

      - name: Verify auto-trade is disabled
        run: |
          grep -Eq 'AUTO_TRADE[[:space:]]*=[[:space:]]*False' app.py || {
            echo "ERROR: AUTO_TRADE is not explicitly False"
            exit 1
          }
          echo "AUTO_TRADE=False verified."

      - name: Success
        run: echo "Flex Adaptive v5 verification completed successfully."
