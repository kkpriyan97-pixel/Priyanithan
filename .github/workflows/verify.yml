name: Verify Candice v8

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Compile clean runtime
        run: python -m py_compile app.py candice_broker.py candice_engine.py candice_memory.py olymptrade_ws/__init__.py olymptrade_ws/core/*.py olymptrade_ws/api/*.py olymptrade_ws/olympconfig/*.py
      - name: Static safety checks
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('app.py').read_text(); trade=Path('olymptrade_ws/api/trade.py').read_text()
          assert "VERSION='8.1-FINAL-TEXT'" in app
          assert 'AUTO_TRADE=False' in app and 'MARTINGALE=False' in app and 'FOREX_MODE=False' in app
          assert 'delete_webhook' in app and 'start_polling' in app
          assert 'send_message' in app and 'edit_message_text' in app
          assert 'send_photo' not in app and 'send_animation' not in app and 'InputMedia' not in app
          assert 'closed_candle_at' in app and 'closed_candle' in app
          assert "RuntimeError('Candice v8 is read-only" in trade
          assert not any(Path('.').glob('*_hotfix.py'))
          print('CANDICE V8 TEXT-ONLY SAFETY VERIFY OK')
          PY
      - name: Technical and lifecycle smoke test
        run: |
          python - <<'PY'
          import pandas as pd
          from candice_engine import technical_snapshot, choose_expiry, EXPIRIES, resample_ohlc
          from candice_broker import Broker
          rows=[]; p=100.0
          for i in range(1000):
              o=p; c=p+0.05; rows.append({'timestamp':1700000000+i*60,'open':o,'high':c+0.01,'low':o-0.01,'close':c}); p=c
          df=pd.DataFrame(rows)
          s=technical_snapshot(df); assert s['direction']=='UP'; assert choose_expiry(s) in EXPIRIES
          for mins in (3,5,10,15):
              agg=resample_ohlc(df,mins)
              assert len(agg)>=60 and agg['timestamp'].is_monotonic_increasing and agg['timestamp'].is_unique
          row=Broker.closed_candle(df,df.timestamp.iloc[-1]+60,60); assert row is not None and row.close==df.close.iloc[-1]
          assert Broker.closed_candle(df,df.timestamp.iloc[-1],60).close==df.close.iloc[-2]
          print('CANDICE MULTI-TF + CLOSED-CANDLE SMOKE OK')
          PY
