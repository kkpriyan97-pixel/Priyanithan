name: Verify Candice v8

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Compile clean runtime
        run: python -m py_compile app.py candice_broker.py candice_engine.py candice_memory.py olymptrade_ws/__init__.py olymptrade_ws/core/*.py olymptrade_ws/api/*.py olymptrade_ws/olympconfig/*.py
      - name: Static safety and lifecycle checks
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('app.py').read_text()
          engine=Path('candice_engine.py').read_text()
          trade=Path('olymptrade_ws/api/trade.py').read_text()

          assert "VERSION = '8.3-FULL-BOT-1M-LIFECYCLE'" in app
          assert "INTERVAL = max(60, int(os.getenv('SCAN_INTERVAL_SECONDS', '60')))" in app
          assert 'AUTO_TRADE = False' in app and 'MARTINGALE = False' in app and 'FOREX_MODE = False' in app
          assert 'delete_webhook' in app and 'start_polling' in app
          assert 'send_message' in app and 'edit_message_text' in app
          assert 'send_photo' not in app and 'send_animation' not in app and 'InputMedia' not in app
          assert 'signal_countdown' in app and 'COUNTDOWN' in app and 'entry_ts' in app
          assert 'closed_candle_at' in app and 'closed_candle' in app
          assert 'int(candle_ts)' in app
          assert 'every 1 minute' in app
          assert 'session_state()!=' not in app
          assert 'EXPIRIES = (2, 3, 5, 15)' in engine
          assert '2|3|5|15' in engine
          assert "RuntimeError('Candice v8 is read-only" in trade
          assert not any(Path('.').glob('*_hotfix.py'))
          print('CANDICE FULL-BOT STATIC SAFETY VERIFY OK')
          PY
      - name: Technical and lifecycle smoke test
        run: |
          python - <<'PY'
          import pandas as pd
          from candice_engine import technical_snapshot, choose_expiry, EXPIRIES, resample_ohlc, closed_1m
          from candice_broker import Broker
          from app import expiry_boundary

          assert set(EXPIRIES) == {2,3,5,15} and 10 not in EXPIRIES

          base_ts=1700000100
          rows=[]; p=100.0
          for i in range(1200):
              o=p; c=p+0.05
              rows.append({'timestamp':base_ts+i*60,'open':o,'high':c+0.01,'low':o-0.01,'close':c})
              p=c
          df=pd.DataFrame(rows)

          closed=closed_1m(df,base_ts+1200*60)
          assert len(closed)==1200 and closed.timestamp.is_monotonic_increasing and closed.timestamp.is_unique
          s=technical_snapshot(closed)
          assert s['direction']=='UP' and choose_expiry(s) in EXPIRIES

          for mins in (3,5,10,15):
              agg=resample_ohlc(closed,mins)
              assert len(agg)>=60, f'{mins}m produced {len(agg)} bars'
              assert agg['timestamp'].is_monotonic_increasing and agg['timestamp'].is_unique
              assert technical_snapshot(agg)['direction']=='UP'

          boundary=float(df.timestamp.iloc[-1])+60
          row=Broker.closed_candle(df,boundary,60)
          assert row is not None and float(row.close)==float(df.close.iloc[-1])
          row2=Broker.closed_candle(df,float(df.timestamp.iloc[-1]),60)
          assert row2 is not None and float(row2.close)==float(df.close.iloc[-2])

          candle_ts=float(df.timestamp.iloc[-1])
          for expiry in (2,3,5,15):
              expected=candle_ts+60+expiry*60
              assert expiry_boundary(candle_ts,expiry)==expected
          print('CANDICE 1M + MULTI-TF + CLOSED-CANDLE + EXPIRY-BOUNDARY SMOKE OK')
          PY
      - name: Read-only broker integration smoke
        run: |
          python - <<'PY'
          import asyncio
          import pandas as pd
          from candice_broker import Broker
          from candice_engine import analyze, EXPIRIES

          class FakeConnection:
              is_connected=True
          class FakeMarket:
              async def get_candles(self,pair,size,count):
                  base=1700000100
                  rows=[]; p=100.0
                  for i in range(max(count,1200)):
                      o=p; c=p+0.05
                      rows.append({'timestamp':base+i*60,'open':o,'high':c+0.01,'low':o-0.01,'close':c})
                      p=c
                  return rows[-count:]
          class FakeClient:
              connection=FakeConnection()
              market=FakeMarket()

          async def main():
              b=Broker('test-token'); b.client=FakeClient()
              df,e=await b.candles('ASIA_X',60,1200,360)
              assert e is None and len(df)==1200
              row=await b.closed_candle_at('ASIA_X',float(df.timestamp.iloc[-1])+60,60,180)
              assert row[0] is not None and row[1] is None
              a=await analyze('ASIA_X',b,{'samples':0})
              assert a.decision in {'APPROVE','REJECT'}
              assert a.expiry in set(EXPIRIES)|{0}
              print('CANDICE READ-ONLY BROKER -> ENGINE INTEGRATION SMOKE OK')
          asyncio.run(main())
          PY
