name: Verify Priyanithan Final

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Compile runtime Python
        run: |
          python -m py_compile app.py sitecustomize.py build_application_hotfix.py live_asset_probe_hotfix.py live_asset_probe_v2_hotfix.py live_asset_refresh_hotfix.py live_ai_monitor_hotfix.py final_result_precision_hotfix.py digital_countdown_hotfix.py loss_recovery_ai_hotfix.py signal_window_countdown_hotfix.py signal_live_update_hotfix.py trade_result_monitor.py signal_engine.py runtime_fixes.py analysis_hotfix.py provider_cleanup_hotfix.py
          python -m py_compile olymptrade_ws/core/*.py olymptrade_ws/api/*.py olymptrade_ws/olympconfig/*.py olymptrade_ws/__init__.py
      - name: Verify core safety and Telegram flow
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path("app.py").read_text(encoding="utf-8")
          site = Path("sitecustomize.py").read_text(encoding="utf-8")
          engine = Path("signal_engine.py").read_text(encoding="utf-8")
          builder = Path("build_application_hotfix.py").read_text(encoding="utf-8")
          probe = Path("live_asset_probe_v2_hotfix.py").read_text(encoding="utf-8")
          refresh = Path("live_asset_refresh_hotfix.py").read_text(encoding="utf-8")
          recovery = Path("loss_recovery_ai_hotfix.py").read_text(encoding="utf-8")
          live = Path("signal_live_update_hotfix.py").read_text(encoding="utf-8")
          assert "AUTO_TRADE = False" in app
          assert "MARTINGALE = False" in app
          assert "LIVE ASSET SELECTION" in app
          assert "Choose DEMO or REAL before the scan" not in app
          assert "one_minute_candle_mode_hotfix" not in site
          assert "disable_legacy_telegram_flow" not in site
          assert "final_access_asset_lock_v2" not in site
          assert 'import build_application_hotfix' in site
          assert 'import live_asset_probe_v2_hotfix' in site
          assert 'import loss_recovery_ai_hotfix' in site
          assert 'import signal_live_update_hotfix' in site
          assert 'CommandHandler("start", app.start_cmd)' in builder
          assert 'CommandHandler("access", app.access_cmd)' in builder
          assert 'CallbackQueryHandler(app.assets_callback' in builder
          assert "AI_CANDIDATE_LIMIT=12" in engine
          assert "EXPIRIES=(2,3,5,10,15)" in engine
          assert "FALLBACK_PAIRS" in probe
          assert "LIVE ASSET DISCOVERY V2 REASONS" in probe
          assert "REFRESH LIVE ASSETS" in refresh
          assert "ONE recovery attempt" in recovery
          assert "LIVE SIGNAL UPDATE V2 ACTIVE" in live
          assert "monitor_result" in live
          print("CORE SAFETY + TELEGRAM + LIVE ASSET + RECOVERY VERIFY OK")
          PY
