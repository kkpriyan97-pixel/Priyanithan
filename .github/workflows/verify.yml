name: Verify Priyanithan Final

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Compile runtime Python
        run: |
          python -m py_compile app.py sitecustomize.py candice_memory_brain.py candice_memory_integration_hotfix.py candice_research_brain_hotfix.py candice_ai_memory_context_hotfix.py candice_timeframe_strategy_brain_hotfix.py duration_selection_hotfix.py build_application_hotfix.py live_asset_probe_hotfix.py live_asset_probe_v2_hotfix.py live_asset_refresh_hotfix.py live_ai_monitor_hotfix.py final_result_precision_hotfix.py digital_countdown_hotfix.py loss_recovery_ai_hotfix.py selected_scan_cycle_hotfix.py signal_window_countdown_hotfix.py signal_live_update_hotfix.py native_live_signal_monitor_hotfix.py trade_result_monitor.py signal_engine.py runtime_fixes.py analysis_hotfix.py provider_cleanup_hotfix.py candice_signal_session_hotfix.py candice_session_status_hotfix.py candice_compare_learn_improve_hotfix.py
          python -m py_compile olymptrade_ws/core/*.py olymptrade_ws/api/*.py olymptrade_ws/olympconfig/*.py olymptrade_ws/__init__.py
      - name: Verify core safety and Telegram flow
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path("app.py").read_text(encoding="utf-8")
          site = Path("sitecustomize.py").read_text(encoding="utf-8")
          engine = Path("signal_engine.py").read_text(encoding="utf-8")
          builder = Path("build_application_hotfix.py").read_text(encoding="utf-8")
          probe = Path("live_asset_probe_v2_hotfix.py").read_text(encoding="utf-8")
          refresh = Path("live_asset_refresh_hotfix.py").read_text(encoding="utf-8")
          recovery = Path("loss_recovery_ai_hotfix.py").read_text(encoding="utf-8")
          live = Path("signal_live_update_hotfix.py").read_text(encoding="utf-8")
          native_live = Path("native_live_signal_monitor_hotfix.py").read_text(encoding="utf-8")
          selected_scan = Path("selected_scan_cycle_hotfix.py").read_text(encoding="utf-8")
          live_ai = Path("live_ai_monitor_hotfix.py").read_text(encoding="utf-8")
          memory = Path("candice_memory_brain.py").read_text(encoding="utf-8")
          memory_runtime = Path("candice_memory_integration_hotfix.py").read_text(encoding="utf-8")
          duration = Path("duration_selection_hotfix.py").read_text(encoding="utf-8")
          research = Path("candice_research_brain_hotfix.py").read_text(encoding="utf-8")
          ai_memory = Path("candice_ai_memory_context_hotfix.py").read_text(encoding="utf-8")
          timeframe = Path("candice_timeframe_strategy_brain_hotfix.py").read_text(encoding="utf-8")
          session = Path("candice_signal_session_hotfix.py").read_text(encoding="utf-8")
          status = Path("candice_session_status_hotfix.py").read_text(encoding="utf-8")
          compare = Path("candice_compare_learn_improve_hotfix.py").read_text(encoding="utf-8")

          assert "AUTO_TRADE = False" in app
          assert "MARTINGALE = False" in app
          assert "LIVE ASSET SELECTION" in app
          assert "Choose DEMO or REAL before the scan" not in app
          assert "REFRESH LIVE ASSETS" in app
          assert 'callback_data="assets:refresh"' in app
          assert "one_minute_candle_mode_hotfix" not in site
          assert "disable_legacy_telegram_flow" not in site
          assert "final_access_asset_lock_v2" not in site
          assert 'import build_application_hotfix' in site
          assert 'import live_asset_probe_v2_hotfix' in site
          assert 'import loss_recovery_ai_hotfix' in site
          assert 'import selected_scan_cycle_hotfix' in site
          assert 'import candice_memory_integration_hotfix' in site
          assert 'import duration_selection_hotfix' in site
          assert 'import signal_live_update_hotfix' in site
          assert 'import native_live_signal_monitor_hotfix' in site
          assert 'import candice_research_brain_hotfix' in site
          assert 'import candice_ai_memory_context_hotfix' in site
          assert 'import candice_timeframe_strategy_brain_hotfix' in site
          assert 'import candice_compare_learn_improve_hotfix' in site
          assert 'import candice_signal_session_hotfix' in site
          assert 'import candice_session_status_hotfix' in site
          assert 'CommandHandler("start", app.start_cmd)' in builder
          assert 'CommandHandler("access", app.access_cmd)' in builder
          assert 'CommandHandler("session", _session_cmd)' in builder
          assert 'CallbackQueryHandler(app.assets_callback' in builder
          assert "AI_CANDIDATE_LIMIT=12" in engine
          assert "EXPIRIES=(2,3,5,10,15)" in engine
          assert "FALLBACK_PAIRS" in probe
          assert "LIVE ASSET DISCOVERY V2 REASONS" in probe
          assert "discover_live_assets" in refresh
          assert "ONE recovery attempt" in recovery
          assert "LIVE SIGNAL UPDATE V2 ACTIVE" in live
          assert "monitor_result" in live
          assert "module.send_signal = _patched_send_signal" in native_live
          assert "_live_monitor" in native_live
          assert "No broker order" in native_live
          assert "send_text" in live_ai
          assert "uid" in live_ai
          assert "module.scan_cycle = scan_cycle" in selected_scan
          assert "SELECTED BOUNDARY SIGNAL SENT" in selected_scan
          assert "class CandiceMemoryBrain" in memory
          assert "record_result" in memory
          assert "similar_experience" in memory
          assert "context_for_ai" in memory
          assert "CANDICE MEMORY INTEGRATION V2 ACTIVE" in memory_runtime
          assert "brain.record_signal" in memory_runtime
          assert "brain.record_result" in memory_runtime
          assert "MIN_EVIDENCE = 5" in memory_runtime
          assert "LOW_WIN_RATE = 45.0" in memory_runtime
          assert "ALLOWED_DURATIONS = (2, 3, 5, 10, 15)" in duration
          assert "def _choose(signal, df1, df5):" in duration
          assert 'signal["duration"]' in duration
          assert "CANDICE DURATION SELECTION V1 ACTIVE" in duration
          assert "CANDICE 24/7 RESEARCH BRAIN V1 ACTIVE" in research
          assert "RESEARCH_INTERVAL_SECONDS = 60" in research
          assert "TIMEFRAMES = (1, 3, 5, 10, 15)" in research
          assert "brain.observe(snapshot)" in research
          assert "OBSERVATION_ONLY" in research
          assert "CANDICE AI MEMORY CONTEXT V1 ACTIVE" in ai_memory
          assert "brain.context_for_ai" in ai_memory
          assert "openrouter.ai/api/v1/chat/completions" in ai_memory
          assert "Never force approval" in ai_memory
          assert "never" in ai_memory.lower() and "orders" in ai_memory.lower()
          assert "STRATEGIES =" in timeframe
          assert "MICRO_MOMENTUM" in timeframe
          assert "PULLBACK_MOMENTUM" in timeframe
          assert "TREND_CONFIRM" in timeframe
          assert "INTRADAY_STRUCTURE" in timeframe
          assert "MACRO_CONTEXT" in timeframe
          assert "build_strategy_context" in timeframe
          assert "MIN_EVIDENCE = 5" in timeframe
          assert "LOW_WIN_RATE = 45.0" in timeframe
          assert "CANDICE TIMEFRAME STRATEGY BRAIN V1 ACTIVE" in timeframe
          assert "never" in timeframe.lower() and "broker orders" in timeframe.lower()
          assert "CANDICE 2H/2H SESSION V4 ACTIVE" in session
          assert "module.analyze_asset = gated_analyze" in session
          assert "module.scan_cycle = gated_scan" in session
          assert "RESEARCH_ONLY" in session
          assert "SIGNAL_SESSION" in session
          assert "Asia/Dubai" in session
          assert "_session_cmd" in status
          assert "CANDICE SESSION STATUS V2 ACTIVE" in status
          assert "CANDICE COMPARE -> LEARN -> IMPROVE" in compare
          print("CORE STATIC VERIFY OK")
          PY
      - name: Smoke test Candice session timing
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import candice_signal_session_hotfix as s

          def ts(h, m=0):
              return datetime(2026, 9, 11, h, m, tzinfo=timezone.utc).timestamp()

          assert s.signal_session_active(ts(0, 30)) is True
          assert s.signal_session_active(ts(1, 59)) is True
          assert s.signal_session_active(ts(2, 0)) is False
          assert s.signal_session_active(ts(3, 59)) is False
          assert s.signal_session_active(ts(4, 0)) is True
          assert s.signal_session_active(ts(5, 59)) is True
          state = s.session_state(ts(2, 30))
          assert state["mode"] == "RESEARCH_ONLY"
          assert state["next_signal_utc"].endswith("04:00:00 UTC")
          assert state["end_uae"].endswith("06:00:00 UAE")
          active = s.session_state(ts(4, 30))
          assert active["mode"] == "SIGNAL_SESSION"
          assert active["end_uae"].endswith("06:00:00 UAE")
          print("CANDICE SESSION SMOKE TEST OK")
          PY
      - name: Smoke test Candice memory brain
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from candice_memory_brain import CandiceMemoryBrain

          with tempfile.TemporaryDirectory() as td:
              brain = CandiceMemoryBrain(Path(td) / "memory.json")
              brain.record_signal({"asset": "TEST", "timeframe": "1M", "strategy": "MOMENTUM", "regime": "TREND", "direction": "UP"})
              brain.record_result({"asset": "TEST", "timeframe": "1M", "strategy": "MOMENTUM", "regime": "TREND", "direction": "UP", "outcome": "WIN", "lesson": "test evidence"})
              score = brain.strategy_score({"asset": "TEST", "timeframe": "1M", "strategy": "MOMENTUM", "regime": "TREND"})
              similar = brain.similar_experience({"asset": "TEST", "timeframe": "1M", "strategy": "MOMENTUM", "regime": "TREND", "direction": "UP"})
              assert score["samples"] == 1
              assert score["wins"] == 1
              assert score["historical_win_rate"] == 100.0
              assert similar
              assert brain.context_for_ai({"asset": "TEST", "timeframe": "1M", "strategy": "MOMENTUM", "regime": "TREND"})["strategy"]["samples"] == 1
          print("CANDICE MEMORY SMOKE TEST OK")
          PY
      - name: Smoke test duration selector
        run: |
          python - <<'PY'
          import pandas as pd
          from duration_selection_hotfix import _choose
          def frame(n=40, step=0.001):
              rows=[]; p=100.0
              for i in range(n):
                  o=p; c=p+step; h=max(o,c)+abs(step)*0.25; l=min(o,c)-abs(step)*0.05
                  rows.append({"timestamp":1700000000+i*60,"open":o,"high":h,"low":l,"close":c}); p=c
              return pd.DataFrame(rows)
          d, r = _choose({"direction":"UP","trend_5m":"UP","ai_confidence":90}, frame(step=.02), frame(step=.01))
          assert d in (2,3,5,10,15) and d != 5
          print("CANDICE DURATION SMOKE TEST OK", d, r)
          PY
      - name: Smoke test AI memory request injection
        run: |
          python - <<'PY'
          import candice_ai_memory_context_hotfix as hook
          assert hook._extract_fields({"messages":[{"role":"user","content":"Asset: TEST\nDirection candidate: UP\n5m trend: UP\nReason: structure"}]}) == ("TEST","UP","UP")
          print("CANDICE AI MEMORY CONTEXT SMOKE TEST OK")
          PY
      - name: Smoke test timeframe strategy brain
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import candice_timeframe_strategy_brain_hotfix as tf
          import candice_memory_brain as memory
          with tempfile.TemporaryDirectory() as td:
              old=memory.brain; memory.brain=memory.CandiceMemoryBrain(Path(td)/"memory.json")
              ctx=tf.build_strategy_context("TEST","UP")
              assert ctx["candidate_direction"] == "UP"
              assert len(ctx["profiles"]) == 5
              assert [x["timeframe"] for x in ctx["profiles"]] == ["1M","3M","5M","10M","15M"]
              assert [x["strategy"] for x in ctx["profiles"]] == ["MICRO_MOMENTUM","PULLBACK_MOMENTUM","TREND_CONFIRM","INTRADAY_STRUCTURE","MACRO_CONTEXT"]
              memory.brain=old
          print("CANDICE TIMEFRAME STRATEGY SMOKE TEST OK")
          PY