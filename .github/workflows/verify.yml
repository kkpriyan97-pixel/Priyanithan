name: Candice Clean Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile all runtime modules
        run: python -m py_compile app.py candice_broker.py candice_engine.py candice_memory.py candice_ui.py candice_patterns.py olymptrade_ws/__init__.py olymptrade_ws/core/*.py olymptrade_ws/api/*.py olymptrade_ws/olympconfig/*.py
      - name: Static safety contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          app=Path('app.py').read_text(); engine=Path('candice_engine.py').read_text(); broker=Path('candice_broker.py').read_text(); trade=Path('olymptrade_ws/api/trade.py').read_text(); readme=Path('README.md').read_text(); env=Path('RENDER_ENV.example').read_text(); patterns=Path('candice_patterns.py').read_text()
          tree=ast.parse(app); constants={}
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id in {'VERSION','INTERVAL','AUTO_TRADE','MARTINGALE','FOREX_MODE'}:
                          try: constants[target.id]=ast.literal_eval(node.value)
                          except Exception: pass
          assert constants.get('VERSION') == '8.9-CANDICE-LIVE-TIMER-FIX'; assert constants.get('INTERVAL') == 60; assert constants.get('AUTO_TRADE') is False; assert constants.get('MARTINGALE') is False; assert constants.get('FOREX_MODE') is False
          assert 'send_photo' in app and 'InputMediaPhoto' in app and 'edit_message_media' in app; assert 'entry_ts' in app and 'closed_candle_at' in app and 'closed_candle' in app; assert 'set_webhook' in app; assert 'start_polling' in app; assert "'LIVE TIMER'" in app and 'build_live_timer_card' in app; assert 'timeframe: str' in app and 'Signal(asset,a.direction,a.confidence,a.expiry,entry,entry_ts,candle_ts,a.timeframe' in app
          assert 'EXPIRIES = (1, 2, 3, 5, 10, 15)' in engine or 'EXPIRIES=(1,2,3,5,10,15)' in engine; assert all(x in engine for x in ('1,2,3,5,10,15','candidate_expiry','choose_expiry')); assert 'CEREBRAS_API_KEY' in engine and 'GROQ_API_KEY' in engine; assert 'OPENROUTER_API_KEY' not in engine
          required_patterns=('Doji','Spinning Top','Bullish Marubozu','Bearish Marubozu','Hammer','Inverted Hammer','Shooting Star','Hanging Man','Bullish Engulfing','Bearish Engulfing','Bullish Harami','Bearish Harami','Piercing Line','Dark Cloud Cover','Tweezer Top','Tweezer Bottom','Bullish Kicker','Bearish Kicker','Morning Star','Evening Star','Three White Soldiers','Three Black Crows','Three Inside','Three Outside','Abandoned Baby','Inside Bar','Outside Bar')
          assert all(x in patterns for x in required_patterns); assert 'detect_candlestick_patterns' in engine; assert 'candle_patterns' in engine
          assert "RuntimeError('Candice v8 is read-only" in trade; assert '1 / 2 / 3 / 5 / 10 / 15' in readme; assert 'TELEGRAM_BOT_TOKEN=' in env and 'CEREBRAS_API_KEY=' in env and 'GROQ_API_KEY=' in env; assert 'OPENROUTER_API_KEY=' not in env
          assert 'chunk_size=min(600,count)' in broker; assert 'end_time=cursor' in broker; assert not any(Path('.').glob('*_hotfix.py')); print('STATIC SAFETY CONTRACT: PASS')
          PY
      - name: Runtime surface test
        run: |
          python - <<'PY'
          import app
          assert app.VERSION == '8.9-CANDICE-LIVE-TIMER-FIX'; assert app.INTERVAL == 60; assert app.AUTO_TRADE is False; assert app.MARTINGALE is False; assert app.FOREX_MODE is False; assert app.WEBHOOK_PATH == '/telegram/webhook'
          c=app.flask_app.test_client(); r=c.get('/'); assert r.status_code == 200 and '8.9-CANDICE-LIVE-TIMER-FIX' in r.get_data(as_text=True); r=c.get('/health'); assert r.status_code == 200 and r.get_data(as_text=True) == 'OK'; r=c.post('/telegram/webhook', json={}); assert r.status_code in {400,503}; assert app.Signal('ASIA_X','UP',80,3,100.0,120.0,60.0,'1M','test',()).timeframe == '1M'; print('RUNTIME SURFACE: PASS')
          PY
      - name: Deterministic technical lifecycle and candle-pattern test
        run: |
          python - <<'PY'
          import pandas as pd
          from candice_engine import technical_snapshot, choose_expiry, human_brain, EXPIRIES, resample_ohlc, closed_1m
          from candice_patterns import detect_candlestick_patterns
          from candice_broker import Broker
          from app import expiry_boundary
          assert set(EXPIRIES)=={1,2,3,5,10,15}; base=1700000100; rows=[]; p=100.0
          for i in range(1200):
              o=p; c=p+0.05; rows.append({'timestamp':base+i*60,'open':o,'high':c+0.01,'low':o-0.01,'close':c}); p=c
          df=pd.DataFrame(rows); closed=closed_1m(df,base+1200*60); assert len(closed)==1200; assert closed.timestamp.is_monotonic_increasing and closed.timestamp.is_unique; snap=technical_snapshot(closed); assert snap['direction']=='UP'; assert choose_expiry(snap) in EXPIRIES
          for mins in (3,5,10,15):
              agg=resample_ohlc(closed,mins); assert len(agg)>=60; assert agg.timestamp.is_monotonic_increasing and agg.timestamp.is_unique; assert technical_snapshot(agg)['direction']=='UP'
          common={'direction':'UP','strength':0.8,'adx14':24,'body_ratio':0.5,'indicator_agreement':4,'indicator_conflicts':0}
          frames10={'1m':common,'3m':common,'5m':common,'10m':{'direction':'UP','adx14':20},'15m':{'direction':'UP','adx14':20}}
          assert human_brain(frames10)['expiry']==10
          frames15={'1m':common,'3m':common,'5m':common,'10m':{'direction':'UP','adx14':28},'15m':{'direction':'UP','adx14':28}}
          assert human_brain(frames15)['expiry']==15
          p_rows=[{'timestamp':1,'open':100,'high':101,'low':98,'close':99},{'timestamp':2,'open':99,'high':100,'low':97,'close':98},{'timestamp':3,'open':98,'high':99,'low':96,'close':97},{'timestamp':4,'open':97.5,'high':98,'low':96.5,'close':97},{'timestamp':5,'open':96.8,'high':100.5,'low':96.5,'close':100.2}]
          pat=detect_candlestick_patterns(pd.DataFrame(p_rows)); assert 'Bullish Engulfing' in pat['bullish']
          last=float(df.timestamp.iloc[-1]); assert Broker.closed_candle(df,last+60,60).timestamp==last; assert Broker.closed_candle(df,last,60).timestamp==last-60
          for expiry in EXPIRIES: assert expiry_boundary(last,expiry)==last+60+expiry*60
          print('TECHNICAL + ADAPTIVE EXPIRY + CANDLE PATTERNS: PASS')
          PY
      - name: Read-only broker to engine integration test
        run: |
          python - <<'PY'
          import asyncio, time
          from candice_broker import Broker
          from candice_engine import analyze, EXPIRIES
          class Conn: is_connected=True
          class Market:
              async def get_candles(self,pair,size,count,end_time=None):
                  anchor=int(end_time if end_time is not None else time.time()); latest=(anchor//60)*60-60; cap=min(count,600); base=latest-(cap-1)*60; rows=[]; p=100.0
                  for i in range(cap):
                      o=p; c=p+0.05; rows.append({'timestamp':base+i*60,'open':o,'high':c+0.01,'low':o-0.01,'close':c}); p=c
                  return rows
          class Client: connection=Conn(); market=Market()
          async def main():
              broker=Broker('test-token'); broker.client=Client(); df,err=await broker.candles('ASIA_X',60,1200,360); assert err is None and len(df)==1200; assert df.timestamp.is_monotonic_increasing and df.timestamp.is_unique; boundary=float(df.timestamp.iloc[-1])+60; row,err=await broker.closed_candle_at('ASIA_X',boundary,60,180); assert err is None and row is not None; decision=await analyze('ASIA_X',broker,{'samples':0}); assert decision.decision in {'APPROVE','REJECT'}; assert decision.expiry in set(EXPIRIES)|{0}; print('BROKER -> ENGINE READ-ONLY INTEGRATION: PASS')
          asyncio.run(main())
          PY
