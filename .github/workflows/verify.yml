name: Candice Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile current runtime
        run: python -m compileall -q app.py brain.py brain_fix.py market_feed.py olymp_client.py telegram.py asset_discovery_fix.py sitecustomize.py
      - name: Import smoke test
        run: python -c "import app, brain, brain_fix, market_feed, olymp_client, telegram, asset_discovery_fix, sitecustomize; print('CANDICE_IMPORT_SMOKE_OK')"
      - name: Static safety contract
        run: |
          python - <<'PY'
          from pathlib import Path
          files = {p.name: p.read_text(encoding='utf-8') for p in map(Path, ['app.py','brain.py','brain_fix.py','market_feed.py','olymp_client.py','telegram.py','asset_discovery_fix.py','sitecustomize.py'])}
          assert 'Auto-trade • OFF' in files['app.py']
          assert 'Martingale • OFF' in files['app.py']
          assert 'READ_ONLY' in files['olymp_client.py']
          assert 'event_183_only=true' in files['sitecustomize.py']
          assert 'authenticated_flex_event_183' in files['asset_discovery_fix.py']
          assert 'CandiceBrain.analyze = analyze' in files['brain_fix.py']
          assert 'RESULT_RETRY_SECONDS' in files['brain.py']
          print('CANDICE_SAFETY_CONTRACT_OK')
          PY
