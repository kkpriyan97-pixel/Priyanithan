name: Verify Candice v8

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Compile clean runtime
        run: python -m py_compile app.py candice_broker.py candice_engine.py candice_memory.py candice_ui.py olymptrade_ws/__init__.py olymptrade_ws/core/*.py olymptrade_ws/api/*.py olymptrade_ws/olympconfig/*.py
      - name: Static safety checks
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('app.py').read_text()
          trade=Path('olymptrade_ws/api/trade.py').read_text()
          assert "AUTO_TRADE=False" in app
          assert "MARTINGALE=False" in app
          assert "FOREX_MODE=False" in app
          assert "MANUAL TRADE ONLY" in app
          assert "delete_webhook" in app
          assert "start_polling" in app
          assert "RuntimeError('Candice v8 is read-only" in trade
          assert not any(Path('.').glob('*_hotfix.py'))
          print('CANDICE V8 SAFETY VERIFY OK')
          PY
      - name: Technical analysis smoke test
        run: |
          python - <<'PY'
          import pandas as pd
          from candice_engine import technical_snapshot, choose_expiry, EXPIRIES
          rows=[]; p=100.0
          for i in range(120):
              o=p; c=p+0.05; rows.append({'timestamp':1700000000+i*60,'open':o,'high':c+0.01,'low':o-0.01,'close':c}); p=c
          s=technical_snapshot(pd.DataFrame(rows))
          assert s['direction']=='UP'
          assert choose_expiry(s) in EXPIRIES
          print('CANDICE TECHNICAL SMOKE OK')
          PY
      - name: UI smoke test
        run: |
          python - <<'PY'
          from candice_ui import gif_bytes
          b=gif_bytes(kind='selected',asset='ASIA_X')
          assert b.read(6)==b'GIF89a'
          print('CANDICE MOBILE GIF SMOKE OK')
          PY
