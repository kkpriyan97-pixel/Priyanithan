name: Verify Priyanithan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py fast_manual_entry.py sitecustomize.py olymptrade_ws/core/*.py olymptrade_ws/api/*.py olymptrade_ws/olympconfig/*.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          app = Path("app.py").read_text(encoding="utf-8")
          fast = Path("fast_manual_entry.py").read_text(encoding="utf-8")
          site = Path("sitecustomize.py").read_text(encoding="utf-8")

          assert "AUTO_TRADE = False" in app
          assert "1, 2, 3, 5, 10, 15" in app
          assert "global ot_client, PAIRS" in app
          assert "1054" in app

          assert "⚡ OPEN TRADE" in fast
          assert "AUTO TRADE: OFF" in fast
          assert "CallbackQueryHandler" in fast
          assert "reply_markup=markup" in fast
          assert "callback_query" in site

          print("Verification OK: core runtime, manual-entry UI, callback webhook, and AUTO_TRADE safety checks passed")
          PY
