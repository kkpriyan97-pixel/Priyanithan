name: Verify Candice v8

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Compile clean runtime
        run: python -m py_compile app.py candice_broker.py candice_engine.py candice_memory.py candice_ui.py olymptrade_ws/__init__.py olymptrade_ws/core/*.py olymptrade_ws/api/*.py olymptrade_ws/olympconfig/*.py
      - name: Static safety checks
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('app.py').read_text(); trade=Path('olymptrade_ws/api/trade.py').read_text()
          assert 'AUTO_TRADE=False' in app and 'MARTINGALE=False' in app and 'FOREX_MODE=False' in app
          assert 'delete_webhook' in app and 'start_polling' in app and 'InputMediaAnimation' in app
          assert 'signal_timer' in app and 'remaining' in app
          assert "RuntimeError('Candice v8 is read-only" in trade
          assert not any(Path('.').glob('*_hotfix.py'))
          print('CANDICE V8 SAFETY VERIFY OK')
          PY
      - name: Technical analysis smoke test
        run: |
          python - <<'PY'
          import pandas as pd
          from candice_engine import technical_snapshot, choose_expiry, EXPIRIES
          rows=[]; p=100.0
          for i in range(120):
              o=p; c=p+0.05; rows.append({'timestamp':1700000000+i*60,'open':o,'high':c+0.01,'low':o-0.01,'close':c}); p=c
          s=technical_snapshot(pd.DataFrame(rows)); assert s['direction']=='UP'; assert choose_expiry(s) in EXPIRIES
          print('CANDICE TECHNICAL SMOKE OK')
          PY
      - name: UI image and timer smoke test
        run: |
          python - <<'PY'
          from candice_ui import png_bytes, gif_bytes, card
          b=png_bytes(kind='signal',asset='ASIA_X',direction='UP',confidence=78,expiry=5,total_seconds=300,remaining=180,signal_time='10:10:00 UAE',expiry_time='10:15:00 UAE')
          assert b.read(8)==b'\x89PNG\r\n\x1a\n'
          g=gif_bytes(kind='result',asset='ASIA_X',direction='WIN',expiry=5,entry='6139.9333',exit='6140.1696',result_time='10:15:00 UAE')
          assert g.read(6)==b'GIF89a'
          assert card(kind='session',asset='ASIA_X',active=True,remaining=120,total_seconds=7200) is not None
          assert card(kind='recovery',asset='ASIA_X',remaining=120,total_seconds=300) is not None
          print('CANDICE IMAGE + TIMER SMOKE OK')
          PY