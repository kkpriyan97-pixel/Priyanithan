name: Fix result delivery

on:
  push:
    paths:
      - fix_result_delivery.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python fix_result_delivery.py
      - name: Validate
        run: python -m py_compile trade_result_monitor.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_result_monitor.py
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Harden signal result delivery"
            git push origin main
          fi
