name: Candice Card Kick

on:
  push:
    paths:
      - 'candice-card-kick.txt'

permissions:
  contents: write

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable the existing card upgrade workflow for the trigger file
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/candice-card-upgrade.yml')
          s=p.read_text()
          old="      - '.github/workflows/candice-card-upgrade.yml'"
          new="      - '.github/workflows/candice-card-upgrade.yml'\n      - 'candice-card-kick.txt'"
          if old not in s:
              raise SystemExit('upgrade workflow trigger pattern not found')
          p.write_text(s.replace(old,new,1))
          print('CARD UPGRADE WORKFLOW REARMED')
          PY
          git config user.name 'Candice AI'
          git config user.email 'candice-ai@users.noreply.github.com'
          git add .github/workflows/candice-card-upgrade.yml
          git commit -m 'Rearm Candice card upgrade trigger'
          git push
