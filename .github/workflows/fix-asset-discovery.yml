name: Fix asset discovery

on:
  push:
    paths:
      - '.github/workflows/fix-asset-discovery.yml'

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch instrument extraction
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app.py")
          s = p.read_text()
          old = 'pair = str(item.get("pair") or item.get("symbol") or item.get("name") or "").upper().strip()'
          new = 'pair = str(item.get("pair") or item.get("symbol") or item.get("name") or item.get("id") or "").upper().strip()'
          if old not in s:
              raise SystemExit("Expected instrument extraction line not found; refusing unsafe patch")
          p.write_text(s.replace(old, new, 1))
          PY
          python -m py_compile app.py
          grep -n 'pair = str(item.get("pair")' app.py

      - name: Commit repaired app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Fix OlympTrade asset discovery from instrument id"
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/fix-asset-discovery.yml
          git commit -m "Remove one-time asset discovery repair workflow"
          git push
