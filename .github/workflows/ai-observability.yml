name: AI observability patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'AI observability patch applied')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch AI logging
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          original = s

          old = '''            payload = {"model": model, "messages": [{"role":"system","content":"Return JSON only."},{"role":"user","content":prompt}], "temperature":0, "max_tokens":300}\n            r = requests.post(url, headers=headers, json=payload, timeout=15)\n            if not r.ok: raise RuntimeError(f"HTTP {r.status_code}: {r.text[:500].replace(chr(10),' ')}")\n            parsed = parse_ai(r.json())\n            log.info("AI VALIDATION OK: provider=%s model=%s", name, model)\n            return parsed, None'''
          new = '''            payload = {"model": model, "messages": [{"role":"system","content":"Return JSON only."},{"role":"user","content":prompt}], "temperature":0, "max_tokens":300}\n            started = time.time()\n            log.info("OPENROUTER REQUEST: provider=%s model=%s prompt_chars=%s", name, model, len(prompt)) if name.startswith("OpenRouter/") else log.info("AI REQUEST: provider=%s model=%s prompt_chars=%s", name, model, len(prompt))\n            r = requests.post(url, headers=headers, json=payload, timeout=15)\n            elapsed = time.time() - started\n            if name.startswith("OpenRouter/"):\n                log.info("OPENROUTER RESPONSE: model=%s status=%s elapsed=%.2fs bytes=%s", model, r.status_code, elapsed, len(r.content))\n            else:\n                log.info("AI RESPONSE: provider=%s model=%s status=%s elapsed=%.2fs bytes=%s", name, model, r.status_code, elapsed, len(r.content))\n            if not r.ok: raise RuntimeError(f"HTTP {r.status_code}: {r.text[:500].replace(chr(10),' ')}")\n            parsed = parse_ai(r.json())\n            log.info("AI VALIDATION OK: provider=%s model=%s", name, model)\n            return parsed, None'''
          if old not in s:
              raise SystemExit('call_ai request block not found')
          s = s.replace(old, new, 1)

          old2 = '''                candidates = sorted((r for r in results if r), key=lambda r: r["scan_score"], reverse=True)\n                candidates = candidates[:MAX_AI_CANDIDATES]\n                approved = []'''
          new2 = '''                candidates = sorted((r for r in results if r), key=lambda r: r["scan_score"], reverse=True)\n                candidates = candidates[:MAX_AI_CANDIDATES]\n                log.info("AI CANDIDATES SELECTED: count=%s assets=%s", len(candidates), [r["pair"] for r in candidates])\n                if not candidates:\n                    log.info("AI DECISION DETAIL: decision=SKIPPED reason=No technical candidates passed the pre-filter")\n                approved = []'''
          if old2 not in s:
              raise SystemExit('scanner candidate block not found')
          s = s.replace(old2, new2, 1)

          old3 = '''                    if ai_err or not ai:\n                        log.warning("AI unavailable for %s: %s", pair, ai_err)\n                        continue'''
          new3 = '''                    if ai_err or not ai:\n                        log.warning("AI unavailable for %s: %s", pair, ai_err)\n                        log.info("AI DECISION DETAIL: pair=%s decision=ERROR direction=NO SIGNAL confidence=0 duration=%s reason=%s", pair, choose_duration_min(result, {}), str(ai_err or "Empty AI response")[:300])\n                        continue'''
          if old3 not in s:
              raise SystemExit('AI error block not found')
          s = s.replace(old3, new3, 1)

          old4 = '''                    log.info("5-minute AI START: pair=%s score=%.1f", pair, result["scan_score"])\n                    try:\n                        ai, ai_err = await asyncio.wait_for(asyncio.to_thread(call_ai, ai_prompt(result)), timeout=90)'''
          new4 = '''                    log.info("5-minute AI START: pair=%s score=%.1f", pair, result["scan_score"])\n                    prompt = ai_prompt(result)\n                    log.info("AI PROMPT READY: pair=%s prompt_chars=%s", pair, len(prompt))\n                    try:\n                        ai, ai_err = await asyncio.wait_for(asyncio.to_thread(call_ai, prompt), timeout=90)'''
          if old4 not in s:
              raise SystemExit('AI start block not found')
          s = s.replace(old4, new4, 1)

          p.write_text(s, encoding='utf-8')
          print('changed:', s != original)
          print('openrouter_request_logs:', s.count('OPENROUTER REQUEST'))
          print('openrouter_response_logs:', s.count('OPENROUTER RESPONSE'))
          print('ai_decision_detail_logs:', s.count('AI DECISION DETAIL'))
          PY

          python -m py_compile app.py

      - name: Commit AI observability patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "app.py already patched"
            exit 0
          fi
          git commit -m "AI observability patch applied"
          git push origin main
