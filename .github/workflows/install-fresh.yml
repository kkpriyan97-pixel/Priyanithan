name: Install Fresh Project

on:
  workflow_dispatch:
  push:
    paths:
      - "Priyanithan-FRESH-FINAL.zip"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract fresh project into repository root
        run: |
          test -f Priyanithan-FRESH-FINAL.zip
          mkdir -p /tmp/fresh
          unzip -q -o Priyanithan-FRESH-FINAL.zip -d /tmp/fresh
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/fresh/. .
          rm -f Priyanithan-FRESH-FINAL.zip

      - name: Commit fresh project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install fresh Priyanithan project" || exit 0
          git push
