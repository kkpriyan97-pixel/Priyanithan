name: Fix /start Live Scan

on:
  push:
    paths:
      - .github/workflows/fix-start-scan.yml
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch start command
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app.py")
          s = p.read_text(encoding="utf-8")
          old = '''async def start_cmd(update: Update, context: ContextTypes.DEFAULT_TYPE):
    remember_chat(update)
    await update.message.reply_text("Priyanithan AI is online. Use /access YOUR_CODE to authorize this chat.")
'''
          new = '''async def start_cmd(update: Update, context: ContextTypes.DEFAULT_TYPE):
    """Start the bot and, when authorized, immediately run one live scan."""
    remember_chat(update)
    if not is_authorized(update):
        await update.message.reply_text(
            "Priyanithan AI is online. Use /access YOUR_CODE to authorize this chat."
        )
        return
    if ot_client is None or not getattr(getattr(ot_client, "connection", None), "is_connected", False):
        await update.message.reply_text(
            "🟡 Bot is online, but the market connection is not ready yet. Please try /start again shortly."
        )
        return
    if AUTO_DISCOVER_ASSETS and not discovered_assets:
        await update.message.reply_text(
            "🟡 Market connection is ready, waiting for the live asset catalogue. Please try /start again shortly."
        )
        return
    await update.message.reply_text("🔎 Live scan started now — checking fresh candles and AI confirmation...")
    try:
        await scan_cycle(context.application)
    except Exception:
        log.exception("Manual /start live scan failed")
        await update.message.reply_text(
            "⚠️ Live scan failed safely. No trade was placed. Check Render logs before retrying."
        )
'''
          if old not in s:
              raise SystemExit("Expected start_cmd block not found; refusing unsafe patch")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Compile
        run: python -m py_compile app.py fast_manual_entry.py sitecustomize.py
      - name: Verify safety and start behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("app.py").read_text(encoding="utf-8")
          assert "AUTO_TRADE = False" in s
          assert "async def start_cmd" in s
          assert "await scan_cycle(context.application)" in s
          assert "No trade was placed" in s
          print("Start-scan verification OK")
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Make authorized start run immediate live scan"
            git push
          fi
