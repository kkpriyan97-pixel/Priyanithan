name: Add AI observability

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch AI observability logs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          original = s

          # 1) Log every AI request entry without exposing API keys or prompt contents.
          marker = 'log.info("OPENROUTER REQUEST: model=%s prompt_chars=%s", OPENROUTER_MODEL, len(str(prompt)))'
          if marker not in s:
              s = s.replace('def call_ai(prompt):\n    providers = []',
                            'def call_ai(prompt):\n    log.info("OPENROUTER REQUEST: model=%s prompt_chars=%s", OPENROUTER_MODEL, len(str(prompt)))\n    providers = []', 1)

          # 2) Log HTTP request/response status for OpenRouter (and fallback providers).
          old = '            r = requests.post(url, headers=headers, json=payload, timeout=15)\n            if not r.ok:'
          new = ('            log.info("AI HTTP REQUEST: provider=%s model=%s", name, model)\n'
                 '            r = requests.post(url, headers=headers, json=payload, timeout=15)\n'
                 '            log.info("OPENROUTER RESPONSE: provider=%s model=%s status=%s", name, model, r.status_code)\n'
                 '            if not r.ok:')
          if 'AI HTTP REQUEST: provider=%s model=%s' not in s:
              s = s.replace(old, new, 1)

          # 3) Log parsed AI output (safe fields only).
          old = '            parsed = parse_ai(r.json())\n            log.info("AI VALIDATION OK: provider=%s model=%s", name, model)'
          new = ('            parsed = parse_ai(r.json())\n'
                 '            log.info("OPENROUTER PARSED: provider=%s model=%s decision=%s direction=%s confidence=%s", name, model, parsed.get("decision"), parsed.get("direction"), parsed.get("confidence"))\n'
                 '            log.info("AI VALIDATION OK: provider=%s model=%s", name, model)')
          if 'OPENROUTER PARSED: provider=%s model=%s' not in s:
              s = s.replace(old, new, 1)

          # 4) Make the no-provider case explicit.
          if 'OPENROUTER REQUEST SKIPPED: no AI provider configured' not in s:
              s = s.replace('    if not providers: return None, "No AI provider configured"',
                            '    if not providers:\n        log.error("OPENROUTER REQUEST SKIPPED: no AI provider configured")\n        return None, "No AI provider configured"', 1)

          # 5) Log candidate selection before AI starts.
          old = '                candidates = candidates[:MAX_AI_CANDIDATES]\n                approved = []'
          new = ('                candidates = candidates[:MAX_AI_CANDIDATES]\n'
                 '                log.info("AI CANDIDATES READY: technical_results=%s selected=%s pairs=%s", sum(1 for r in results if r), len(candidates), [r["pair"] for r in candidates])\n'
                 '                approved = []')
          if 'AI CANDIDATES READY: technical_results=' not in s:
              s = s.replace(old, new, 1)

          # 6) Log AI start/failure/complete in the automatic scanner.
          old = '                    log.info("5-minute AI START: pair=%s score=%.1f", pair, result["scan_score"])\n                    try:'
          new = '                    log.info("5-minute AI START: pair=%s score=%.1f", pair, result["scan_score"])\n                    log.info("OPENROUTER AI START: pair=%s score=%.1f model=%s", pair, result["scan_score"], OPENROUTER_MODEL)\n                    try:'
          if 'OPENROUTER AI START: pair=%s' not in s:
              s = s.replace(old, new, 1)

          old = '                    if ai_err or not ai:\n                        log.warning("AI unavailable for %s: %s", pair, ai_err)\n                        continue'
          new = ('                    if ai_err or not ai:\n'
                 '                        log.warning("OPENROUTER AI FAILED: pair=%s error=%s", pair, ai_err)\n'
                 '                        continue\n'
                 '                    log.info("OPENROUTER AI COMPLETE: pair=%s raw_decision=%s raw_direction=%s raw_confidence=%s", pair, ai.get("decision"), ai.get("direction"), ai.get("confidence"))')
          if 'OPENROUTER AI FAILED: pair=%s' not in s:
              s = s.replace(old, new, 1)

          # 7) Always log the normalized decision before approval filtering.
          old = '                    ai = normalize_ai_decision(ai)\n                    direction = str(ai.get("direction", "NO SIGNAL")).upper()'
          new = ('                    ai = normalize_ai_decision(ai)\n'
                 '                    log.info("AI DECISION DETAIL: pair=%s decision=%s direction=%s confidence=%s reason=%s", pair, ai.get("decision"), ai.get("direction"), ai.get("confidence"), str(ai.get("reason", ai.get("decision_error", "")))[:300])\n'
                 '                    direction = str(ai.get("direction", "NO SIGNAL")).upper()')
          if 'AI DECISION DETAIL: pair=%s decision=%s direction=%s confidence=%s reason=' not in s:
              s = s.replace(old, new, 1)

          # 8) Keep final approval result separately visible.
          old = '                    log.info("AI DECISION DETAIL: pair=%s decision=%s direction=%s confidence=%s duration=%s reason=%s", pair, decision, direction, conf, duration, str(ai.get("reason", ""))[:300])'
          new = '                    log.info("AI DECISION FINAL: pair=%s decision=%s direction=%s confidence=%s duration=%s approved=%s reason=%s", pair, decision, direction, conf, duration, approved_flag, str(ai.get("reason", ai.get("decision_error", "")))[:300])'
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          print('changed:', s != original)
          print('openrouter_request_log:', 'OPENROUTER REQUEST:' in s)
          print('openrouter_response_log:', 'OPENROUTER RESPONSE:' in s)
          print('ai_decision_detail_log:', 'AI DECISION DETAIL:' in s)
          PY
          python -m py_compile app.py

      - name: Commit patched app
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "AI observability already present"
            exit 0
          fi
          git commit -m "Add OpenRouter AI decision observability"
          git push origin main
