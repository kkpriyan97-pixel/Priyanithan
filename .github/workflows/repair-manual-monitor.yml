name: Repair missing manual trade monitor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore missing monitor from known-good runtime
        shell: python
        run: |
          from pathlib import Path
          import ast, subprocess
          p = Path('app.py')
          text = p.read_text(encoding='utf-8')
          tree = ast.parse(text)
          names = {n.name for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
          if 'manual_trade_monitor' not in names:
              known = subprocess.check_output(['git','show','b3223c0d5c88ac2ead4f39646f3eef6a3e776706:app.py'], text=True)
              kt = ast.parse(known)
              fn = next(n for n in kt.body if isinstance(n, ast.AsyncFunctionDef) and n.name == 'manual_trade_monitor')
              lines = known.splitlines(True)
              block = ''.join(lines[fn.lineno-1:fn.end_lineno])
              marker = '\n\n# ============================================================\n# RUNTIME\n# ============================================================'
              if marker not in text:
                  raise SystemExit('Runtime marker not found')
              text = text.replace(marker, '\n\n' + block + marker, 1)
              p.write_text(text, encoding='utf-8')
          ast.parse(text)
          subprocess.run(['python','-m','py_compile','app.py'], check=True)
      - name: Commit and remove repair workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git rm .github/workflows/repair-manual-monitor.yml
          git commit -m "Restore manual trade monitor runtime" || exit 0
          git push origin main
