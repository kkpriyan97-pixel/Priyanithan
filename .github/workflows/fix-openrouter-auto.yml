name: Restore and Fix OpenRouter

on:
  push:
    paths:
      - app.py
      - .github/workflows/fix-openrouter-auto.yml
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore last known good production app
        shell: bash
        run: |
          git fetch origin 0d6725b41867e9d481fde545c4c6204e7720ce61 --depth=1
          git checkout 0d6725b41867e9d481fde545c4c6204e7720ce61 -- app.py

      - name: Patch OpenRouter response parsing
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')

          start = s.index('def parse_ai(data):')
          end = s.index('\ndef call_ai(prompt):', start)
          new_parse = '''def parse_ai(data):
    """Parse OpenAI/OpenRouter responses including reasoning/text JSON variants."""
    if not isinstance(data, dict):
        raise ValueError(f"AI response is not an object: {str(data)[:400]}")
    choices = data.get("choices")
    if not isinstance(choices, list) or not choices:
        raise ValueError(f"AI response missing choices: {str(data)[:600]}")
    choice = choices[0] if isinstance(choices[0], dict) else {}
    msg = choice.get("message") if isinstance(choice.get("message"), dict) else {}

    candidates = []
    for value in (msg.get("content"), msg.get("reasoning"), msg.get("reasoning_content"), choice.get("text")):
        if value is None:
            continue
        if isinstance(value, list):
            parts = []
            for item in value:
                if isinstance(item, dict):
                    parts.append(str(item.get("text", item.get("content", ""))))
                else:
                    parts.append(str(item))
            value = "".join(parts)
        elif isinstance(value, dict):
            value = value.get("text", value.get("content", ""))
        value = str(value).strip()
        if value:
            candidates.append(value)

    last_error = None
    for content in candidates:
        cleaned = re.sub(r"<think>.*?</think>", " ", content, flags=re.I | re.S).strip()
        cleaned = re.sub(r"^```(?:json)?\\s*", "", cleaned, flags=re.I)
        cleaned = re.sub(r"\\s*```$", "", cleaned).strip()
        try:
            obj = json.loads(cleaned)
            if isinstance(obj, dict):
                return obj
        except Exception as e:
            last_error = e
        first, last = cleaned.find("{"), cleaned.rfind("}")
        if first >= 0 and last > first:
            try:
                obj = json.loads(cleaned[first:last + 1])
                if isinstance(obj, dict):
                    return obj
            except Exception as e:
                last_error = e

    raise ValueError(f"AI JSON parse failed: {last_error}; content={candidates[0][:600] if candidates else 'EMPTY'}")
'''
          s = s[:start] + new_parse + s[end:]

          old = '"temperature":0, "max_tokens":300'
          new = '"temperature":0, "max_tokens":300, "response_format":{"type":"json_object"}'
          if old in s:
              s = s.replace(old, new, 1)

          old_models = 'for m in (OPENROUTER_MODEL, "openrouter/free", "minimax/minimax-m3:free", "google/gemma-4-26b-a4b-it:free"):'
          if old_models in s:
              s = s.replace(old_models, 'for m in (OPENROUTER_MODEL,):', 1)

          p.write_text(s, encoding='utf-8')
          compile(s, 'app.py', 'exec')
          print('Production app restored and parser patched')

      - name: Commit and push repaired app
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --check
          git commit -m "Fix OpenRouter auto JSON parsing [skip ci]" || exit 0
          git push origin HEAD:main
