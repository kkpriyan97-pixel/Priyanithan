name: Enable ASIA_X

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Patch app.py for ASIA_X
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("app.py")
          if not p.exists():
              raise SystemExit("app.py not found")

          s = p.read_text()

          old = 'PAIR_ENV = os.getenv("OLYMP_PAIRS", "EURUSD,GBPUSD")'
          new = 'PAIR_ENV = os.getenv("OLYMP_PAIRS", "ASIA_X")'

          if old in s:
              s = s.replace(old, new, 1)

          old_alias = 'PAIR_ALIASES = {"EURUSD": os.getenv("OT_EURUSD_PAIR","EURUSD"), "GBPUSD": os.getenv("OT_GBPUSD_PAIR","GBPUSD")}'
          new_alias = 'PAIR_ALIASES = {"ASIA_X": os.getenv("OT_ASIA_X_PAIR","ASIA_X"), "EURUSD": os.getenv("OT_EURUSD_PAIR","EURUSD"), "GBPUSD": os.getenv("OT_GBPUSD_PAIR","GBPUSD")}'

          if old_alias in s:
              s = s.replace(old_alias, new_alias, 1)
          elif 'PAIR_ALIASES =' in s and 'ASIA_X' not in s.split('PAIR_ALIASES =', 1)[1].split('\n', 1)[0]:
              lines = s.splitlines()
              for i, line in enumerate(lines):
                  if line.strip().startswith("PAIR_ALIASES ="):
                      lines[i] = 'PAIR_ALIASES = {"ASIA_X": os.getenv("OT_ASIA_X_PAIR","ASIA_X"), "EURUSD": os.getenv("OT_EURUSD_PAIR","EURUSD"), "GBPUSD": os.getenv("OT_GBPUSD_PAIR","GBPUSD")}'
                      s = "\n".join(lines) + ("\n" if s.endswith("\n") else "")
                      break

          p.write_text(s)

          # Verify the patch actually took effect.
          check = p.read_text()
          if 'OLYMP_PAIRS", "ASIA_X"' not in check:
              raise SystemExit("ASIA_X default pair patch was not applied")
          if 'ASIA_X": os.getenv("OT_ASIA_X_PAIR","ASIA_X")' not in check:
              raise SystemExit("ASIA_X alias patch was not applied")

          print("ASIA_X patch verified")

      - name: Commit patched bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Enable ASIA_X live market" || echo "No changes"
          git push
